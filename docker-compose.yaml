version: "3"

services:
  # Online Course Service
  online-course:
    build: .
    image: online-course:1.0.0
    container_name: online-course
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - nginx-online-course
      - mysql
    networks:
      - online-course-network

  # Nginx Web Server for Online Course
  nginx-online-course:
    image: nginx:alpine
    container_name: nginx-online-course
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www/html
    networks:
      - online-course-network

    # NPM Dev Service
  npm-dev:
    image: node:18
    container_name: npm-dev
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173" # Port default Vite
    networks:
      - online-course-network
    depends_on:
      - online-course

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: online_course
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - online-course-network

  # phpMyAdmin Service
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8082:80"
    depends_on:
      - mysql
    networks:
      - online-course-network

networks:
  online-course-network:
    driver: bridge

volumes:
  dbdata:
